[package]
name    = "dynatos-web"
version = "0.1.0"
edition = "2024"

[dependencies]

# Workspace
dynatos-store      = { default-features = false, path = "../dynatos-store" }
dynatos-util       = { default-features = false, path = "../dynatos-util" }
dynatos-web-macros = { default-features = false, path = "../dynatos-web-macros" }
dynatos-web-parser = { default-features = false, path = "../dynatos-web-parser" }

app-error = { workspace = true }
duplicate = { workspace = true }
extend = { workspace = true }
itertools = { workspace = true }
js-sys = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { features = [
	"AnimationEvent",
	"ClipboardEvent",
	"Comment",
	"CssStyleDeclaration",
	"Document",
	"DragEvent",
	"Element",
	"Event",
	"EventTarget",
	"FocusEvent",
	"History",
	"HtmlBodyElement",
	"HtmlCanvasElement",
	"HtmlDetailsElement",
	"HtmlDialogElement",
	"HtmlElement",
	"HtmlHeadElement",
	"HtmlImageElement",
	"HtmlInputElement",
	"HtmlTextAreaElement",
	"InputEvent",
	"Location",
	"MouseEvent",
	"Node",
	"PointerEvent",
	"PopStateEvent",
	"SubmitEvent",
	"Text",
	"ToggleEvent",
	"TransitionEvent",
	"WheelEvent",
	"Window",
	"console",
], workspace = true }

[lints]
workspace = true
